<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Glow & Shadow -->
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4FACFE" flood-opacity="0.3"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A"/>
      <stop offset="50%" stop-color="#161B2E"/>
      <stop offset="100%" stop-color="#0A0C14"/>
    </linearGradient>

    <!-- Border Metallic Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9B51E0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Mountain Spectrum Gradients -->
    <linearGradient id="mountainBack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>

    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <linearGradient id="mountainFront" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Sun / Aperture Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD200"/>
      <stop offset="60%" stop-color="#F7971E"/>
      <stop offset="100%" stop-color="#FF512F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS Style Squircle Container -->
  <g filter="url(#appShadow)">
    <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
  </g>

  <!-- Ambient Light Reflection -->
  <path d="M 132 36 Q 256 70 380 36 C 420 36 448 64 448 104 L 448 180 Q 256 120 64 180 L 64 104 C 64 64 92 36 132 36 Z" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- Glowing Cosmic Sun / Lens Aperture -->
  <circle cx="256" cy="200" r="75" fill="url(#sunGlow)" filter="url(#neonGlow)"/>

  <!-- Dynamic Wave & Mountain Layer 1 (Back Peak) -->
  <path d="M 80 380 L 190 230 L 270 320 L 360 210 L 432 380 Z" fill="url(#mountainBack)" opacity="0.6"/>

  <!-- Dynamic Wave & Mountain Layer 2 (Mid Peak) -->
  <path d="M 64 400 L 160 270 L 256 370 L 380 230 L 448 400 Z" fill="url(#mountainMid)" opacity="0.8"/>

  <!-- Vibrant Wave & Mountain Layer 3 (Front Apex) -->
  <path d="M 64 420 Q 160 310 256 350 T 448 420 L 448 440 C 448 460 430 480 410 480 L 102 480 C 80 480 64 460 64 440 Z" fill="url(#mountainFront)"/>

  <!-- Aperture Iris Geometric Accent Overlays -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#neonGlow)">
    <!-- Sleek Aperture Angles -->
    <polygon points="256,150 300,175 300,225 256,250 212,225 212,175" fill="none" stroke="#00F2FE" stroke-width="2.5"/>
    <circle cx="256" cy="200" r="18" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
