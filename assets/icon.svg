<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Standard Drop Shadow Filters -->
    <filter id="macAppShadow" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Primary Depth Shadow -->
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
      <!-- Soft Ambient Shadow -->
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
      <!-- Subtle Bottom Rim Glow -->
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00F2FE" flood-opacity="0.25"/>
    </filter>

    <!-- Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111D"/>
      <stop offset="45%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#08090F"/>
    </linearGradient>

    <!-- Metallic Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9B51E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Mountain Spectrum Gradients -->
    <linearGradient id="mountainBack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A00F4"/>
      <stop offset="100%" stop-color="#D800E6"/>
    </linearGradient>

    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0062FF"/>
    </linearGradient>

    <linearGradient id="mountainFront" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3A88FE"/>
    </linearGradient>

    <!-- Sun / Horizon Flare Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="35%" stop-color="#FFA800"/>
      <stop offset="70%" stop-color="#FF4B2B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF416C" stop-opacity="0"/>
    </radialGradient>

    <!-- Apple HIG Standard 824x824 Squircle Clip Path centered at (100, 100) -->
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>

    <!-- Glow Filter for Aperture Core -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow Base Element (Bakes the official Apple shadow outside the squircle) -->
  <g filter="url(#macAppShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#0E111D"/>
  </g>

  <!-- Clipped Squircle Content Body -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect x="100" y="100" width="824" height="824" fill="url(#bgGrad)"/>

    <!-- Ambient Cosmic Stars/Dust -->
    <circle cx="250" cy="240" r="2.5" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="340" cy="310" r="2" fill="#00F2FE" opacity="0.55"/>
    <circle cx="730" cy="220" r="3" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="800" cy="320" r="2.5" fill="#9B51E0" opacity="0.65"/>
    <circle cx="580" cy="180" r="2" fill="#00C6FF" opacity="0.5"/>

    <!-- Top Glass Ambient Highlight -->
    <path d="M 100 100 L 924 100 L 924 380 Q 512 240 100 380 Z" fill="#FFFFFF" fill-opacity="0.05"/>

    <!-- Glowing Sun / Camera Aperture Core -->
    <circle cx="512" cy="420" r="160" fill="url(#sunGlow)"/>

    <!-- Geometric Aperture Hexagon Over Sun -->
    <g stroke="#00F2FE" stroke-width="5" fill="none" filter="url(#neonGlow)" opacity="0.95">
      <polygon points="512,320 598,370 598,470 512,520 426,470 426,370"/>
      <circle cx="512" cy="420" r="36" fill="#FFFFFF" stroke="#FFA800" stroke-width="4"/>
    </g>

    <!-- Mountain Layer 1: Back Peak (Cosmic Violet / Magenta) -->
    <path d="M 100 840 L 100 700 L 300 480 L 450 630 L 650 400 L 870 680 L 924 600 L 924 924 L 100 924 Z" fill="url(#mountainBack)" opacity="0.75"/>

    <!-- Mountain Layer 2: Mid Peak (Sapphire / Royal Blue) -->
    <path d="M 100 860 L 100 730 L 260 520 L 460 720 L 710 450 L 924 710 L 924 924 L 100 924 Z" fill="url(#mountainMid)" opacity="0.9"/>

    <!-- Mountain Layer 3: Front Wave & Peak (Electric Cyan / Aqua Apex) -->
    <path d="M 100 780 Q 300 580 500 660 T 924 720 L 924 924 L 100 924 Z" fill="url(#mountainFront)"/>

    <!-- Dynamic Foreground Accent Crest -->
    <path d="M 100 870 Q 340 700 580 790 T 924 820 L 924 924 L 100 924 Z" fill="#00F2FE" opacity="0.35"/>
  </g>

  <!-- Crisp Metallic Squircle Inset Border -->
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
</svg>
