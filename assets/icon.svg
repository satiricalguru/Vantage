<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111D"/>
      <stop offset="45%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#08090F"/>
    </linearGradient>

    <!-- Metallic Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9B51E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Mountain Spectrum Gradients -->
    <linearGradient id="mountainBack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A00F4"/>
      <stop offset="100%" stop-color="#D800E6"/>
    </linearGradient>

    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0062FF"/>
    </linearGradient>

    <linearGradient id="mountainFront" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3A88FE"/>
    </linearGradient>

    <!-- Sun / Horizon Flare Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3A8"/>
      <stop offset="35%" stop-color="#FFA800"/>
      <stop offset="70%" stop-color="#FF4B2B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF416C" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Path for Perfect Squircle Masking -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Inner Shadow / Inset Lighting -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Squircle Group Clipped Cleanly -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Ambient Cosmic Stars/Dust -->
    <circle cx="90" cy="90" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="150" cy="130" r="1" fill="#00F2FE" opacity="0.5"/>
    <circle cx="380" cy="80" r="2" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="430" cy="140" r="1.5" fill="#9B51E0" opacity="0.6"/>
    <circle cx="290" cy="60" r="1.5" fill="#00C6FF" opacity="0.4"/>

    <!-- Subtle Top Ambient Glass Highlight -->
    <path d="M 0 0 L 512 0 L 512 160 Q 256 90 0 160 Z" fill="#FFFFFF" fill-opacity="0.05"/>

    <!-- Glowing Sun / Camera Aperture Core -->
    <circle cx="256" cy="190" r="95" fill="url(#sunGlow)"/>

    <!-- Geometric Aperture Hexagon Over Sun -->
    <g stroke="#00F2FE" stroke-width="3.5" fill="none" filter="url(#neonGlow)" opacity="0.95">
      <polygon points="256,132 306,161 306,219 256,248 206,219 206,161"/>
      <circle cx="256" cy="190" r="22" fill="#FFFFFF" stroke="#FFA800" stroke-width="2.5"/>
    </g>

    <!-- Mountain Layer 1: Back Peak (Cosmic Violet / Magenta) -->
    <path d="M 0 460 L 0 380 L 130 240 L 220 330 L 330 200 L 460 360 L 512 310 L 512 512 L 0 512 Z" fill="url(#mountainBack)" opacity="0.75"/>

    <!-- Mountain Layer 2: Mid Peak (Sapphire / Royal Blue) -->
    <path d="M 0 470 L 0 390 L 100 270 L 220 390 L 370 230 L 512 380 L 512 512 L 0 512 Z" fill="url(#mountainMid)" opacity="0.9"/>

    <!-- Mountain Layer 3: Front Wave & Peak (Electric Cyan / Aqua Apex) -->
    <path d="M 0 430 Q 120 310 240 360 T 512 390 L 512 512 L 0 512 Z" fill="url(#mountainFront)"/>

    <!-- Dynamic Foreground Accent Crest -->
    <path d="M 0 480 Q 140 370 280 430 T 512 450 L 512 512 L 0 512 Z" fill="#00F2FE" opacity="0.35"/>
  </g>

  <!-- Crisp Metallic Squircle Outer Border -->
  <rect x="1" y="1" width="510" height="510" rx="114" ry="114" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
</svg>
