<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Vantage — your desktop, alive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161b"/>
      <stop offset="0.55" stop-color="#090a0d"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#6EE7DA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6EE7DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#B59CFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#B59CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#glowA)"/>
    <rect width="1280" height="400" fill="url(#glowB)"/>
    <!-- concentric aperture rings, right side -->
    <g fill="none" stroke="#fff" stroke-linecap="round" transform="translate(1000 200)">
      <circle r="250" stroke-opacity="0.05" stroke-width="1.5"/>
      <circle r="190" stroke-opacity="0.07" stroke-width="1.5"/>
      <circle r="130" stroke-opacity="0.10" stroke-width="1.5"/>
      <g transform="scale(9.2) translate(-12 -12)" stroke-width="0.9" stroke-opacity="0.95">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3L16 12M19.8 7.5L12 16M19.8 16.5L9 12M12 21L8 12M4.2 16.5L12 8M4.2 7.5L15 12"/>
      </g>
    </g>
    <!-- wordmark -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="#EEF0F4">
      <text x="88" y="150" font-size="22" letter-spacing="6" fill="#8D92A1" font-family="ui-monospace, 'SF Mono', Menlo, monospace">LIVE WALLPAPERS · MAC &amp; WINDOWS</text>
      <text x="84" y="250" font-size="112" font-weight="600" letter-spacing="-4">Vantage</text>
      <text x="88" y="306" font-size="30" fill="#B8BCC8">Your desktop, alive.</text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="398" rx="27" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
